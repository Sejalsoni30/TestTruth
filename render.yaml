services:
  # TestTruth Backend Node.js API Service
  - type: web
    name: testtruth-backend
    env: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix backend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # TestTruth Frontend React + Vite Static Site
  - type: web
    name: testtruth-frontend
    env: static
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
